services:
  php-app:
    build: .
    container_name: car_rent_app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=hannes
      - DB_PASSWORD=Passw0rd
      - DB_NAME=car_rent
    depends_on:
      - db
    networks:
      - car_rent_network
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: car_rent_db
    environment:
      MYSQL_ROOT_PASSWORD: docker123
      MYSQL_DATABASE: car_rent
      MYSQL_USER: hannes
      MYSQL_PASSWORD: Passw0rd
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - car_rent_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: car_rent_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: docker123
    depends_on:
      - db
    networks:
      - car_rent_network
    restart: unless-stopped

volumes:
  db_data:

networks:
  car_rent_network:
    driver: bridge
